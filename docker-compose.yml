services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pila
      POSTGRES_PASSWORD: pila
      POSTGRES_DB: pila
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data


  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    # La conexión a la base (Supabase) se toma de backend/.env. Si ese archivo no existe
    # (desarrollo local), la app usa su valor por defecto (el servicio db de este compose).
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./almacen:/almacen
      - ./backend/app:/repo/backend/app
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
