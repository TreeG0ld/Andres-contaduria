services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pila
      POSTGRES_PASSWORD: pila
      POSTGRES_DB: pila
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data


  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://pila:pila@db:5432/pila
    volumes:
      - ./almacen:/almacen
      - ./backend/app:/repo/backend/app
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
