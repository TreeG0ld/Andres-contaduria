<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Cuadro negro, el mismo tono de la barra lateral -->
  <rect width="64" height="64" rx="15" fill="#0a0a0b"/>
  <!-- La C va dibujada como trazo, no como texto: el navegador renderiza el
       favicon sin cargar Nunito, así que un <text> saldría con otra fuente.
       Las puntas redondeadas imitan el carácter de Nunito. -->
  <path d="M42.6 21.4A15 15 0 1 0 42.6 42.6"
        fill="none"
        stroke="#ffffff"
        stroke-width="10"
        stroke-linecap="round"/>
</svg>
